<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Access Unlocked | CamAnime</title>
    <meta name="theme-color" content="#087BFF">
    <link rel="icon" href="/static/brand/camanime-icon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #07080d; color: #f3f5fa; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: rgba(7, 8, 13, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); width: 100%; padding: 0.85rem 2rem; }
        .site-title { display: inline-flex; align-items: center; text-decoration: none; }
        .site-title img { display: block; width: 220px; max-width: min(58vw, 220px); height: auto; }
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .success-card { background: #0e111a; border-radius: 24px; padding: 3.5rem 2.5rem; border: 1px solid rgba(255, 179, 71, 0.35); text-align: center; max-width: 580px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,0.7); }
        .icon-circle { width: 92px; height: 92px; background: rgba(16, 185, 129, 0.14); border: 2px solid #10B981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.75rem; color: #34d399; font-size: 2.5rem; }
        h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.6rem,1.35rem + 2vw,2.25rem); font-weight: 800; margin-bottom: 0.85rem; }
        p { color: #a0abc0; font-size: 1.05rem; margin-bottom: 2rem; }
        .btn-primary { background: linear-gradient(135deg, #FFB347, #FF5E62); color: #07080d; padding: 0.9rem 2rem; border-radius: 999px; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 0.6rem; }
    </style>
<script>try{var t=localStorage.getItem('camanime-theme');if(['midnight','light','vibrant','sakura','forest'].indexOf(t)===-1)t='midnight';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link href="/static/css/sync.css" rel="stylesheet">
<script src="/static/js/site.js" defer></script>
</head>
<body>
<header>
    <a href="/" class="site-title" aria-label="CamAnime — Watch, discover, enjoy"><img src="/static/brand/camanime-logo.svg" alt="CamAnime — Watch • Discover • Enjoy"></a>
</header>
<div class="container">
    <div class="success-card">
        <div class="icon-circle"><i class="fas fa-check"></i></div>
        <h1>Your CamAnime account is active</h1>
        <p>Playback and audio options vary by episode and are available only when a configured provider lists a source.</p>
        <a href="/" class="btn-primary"><i class="fas fa-play"></i> Start Watching</a>
    </div>
</div>
</body>
</html>
