<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — {{ title }} | CamAnime</title>
    <meta name="description" content="CamAnime {{ code }}: {{ title }}. Discover anime, browse episode guides, and track the simulcast schedule.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#087BFF">
    <link rel="icon" href="/static/brand/camanime-icon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07080D;color:#f3f5fa;font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
        .card{max-width:560px;text-align:center;background:#0d1018;border:1px solid #1c2333;border-radius:16px;padding:48px 36px}
        .code{font-size:clamp(3rem,12vw,5rem);font-weight:800;color:#FFB347;line-height:1;margin:0}
        h1{font-size:1.4rem;margin:.6rem 0}
        p{color:#a0abc0;margin:.4rem 0 1.4rem}
        .row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
        a.btn{display:inline-block;padding:.7rem 1.3rem;border-radius:10px;text-decoration:none;font-weight:700}
        a.primary{background:#FFB347;color:#07080D}
        a.ghost{border:1px solid #2a3450;color:#f3f5fa}
        a:focus-visible{outline:3px solid #12CDE8;outline-offset:3px}
        img.logo{width:min(220px,60vw);height:auto;margin-bottom:1rem}
    </style>
</head>
<body>
    <main class="card">
        <a href="/" aria-label="CamAnime home"><img class="logo" src="/static/brand/camanime-logo.svg" alt="CamAnime — Watch • Discover • Enjoy" fetchpriority="high"></a>
        <p class="code">{{ code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="row">
            <a class="btn primary" href="/">Back to Discover</a>
            <a class="btn ghost" href="/search?q=naruto">Search anime</a>
        </div>
    </main>
</body>
</html>
