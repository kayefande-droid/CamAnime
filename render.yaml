services:
  - type: web
    name: camanime
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 2 --timeout 60
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CAMANIME_SECRET
        generateValue: true
      # Set CAMANIME_ADMIN_EMAIL and CAMANIME_ADMIN_PASSWORD together in the Render dashboard.
      # A Render free instance has ephemeral storage; attach a paid persistent disk
      # or use a managed database before expecting SQLite records to survive redeploys.
