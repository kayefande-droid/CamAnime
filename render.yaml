services:
  - type: web
    name: camanime
    runtime: python
    plan: free
    # --no-cache-dir: pip cache can eat 100s of MB of the free-tier disk during build.
    # rm -rf: the Flutter app, Windows app, promo kit, tools, tests and docs are NOT
    # needed to run the website — deleting them from the build checkout keeps the
    # runtime disk slim. All site functions are served from app.py + templates + static.
    # Binaries (/download, /get/*) fall back to GitHub Releases automatically.
    # No ffmpeg on the host: CamAnime serves only the qualities and audio the
    # provider actually publishes. Nothing is re-encoded or invented.
    buildCommand: pip install --no-cache-dir -r requirements.txt && rm -rf mobile windows promo tools tests docs .idea __pycache__ .pytest_cache && find . -name "__pycache__" -type d -prune -exec rm -rf {} +
    # 1 worker x 4 threads fits the 512MB free instance; max-requests recycles the
    # worker to stop slow memory growth; warning log level keeps Render logs small.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 100 --access-logfile - --log-level warning
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: LOG_LEVEL
        value: warning
      - key: CAMANIME_SECRET
        generateValue: true
      # Persistent storage: the website keeps users, comments, ratings and
      # notifications in the Cloudflare D1 database that the worker deployment
      # already uses, so a redeploy no longer wipes them. The account and database
      # ids are public identifiers; the token must be set in the Render dashboard
      # (Environment → CAMANIME_D1_TOKEN) with D1 Edit permission. Without the
      # token the app falls back to the local SQLite file.
      - key: CAMANIME_D1_ACCOUNT_ID
        value: e808f37cb821babc29eeea020f377b09
      - key: CAMANIME_D1_DATABASE_ID
        value: 23847663-1064-422b-a12d-e3d602a9c745
      - key: CAMANIME_D1_TOKEN
        sync: false
      # Set CAMANIME_ADMIN_EMAIL and CAMANIME_ADMIN_PASSWORD together in the Render dashboard.
