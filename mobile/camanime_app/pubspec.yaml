name: camanime_app
description: CamAnime Flutter app for shared anime discovery, cached artwork, and authorized playback. Made by kayefande-droid & co.
publish_to: none
version: 1.2.0+3
environment:
  sdk: ">=3.2.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.7
  video_player: ^2.9.1
  chewie: ^1.8.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/camanime-logo.png
