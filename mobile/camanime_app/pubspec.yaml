name: camanime_app
description: CamAnime Flutter app for shared anime discovery, cached artwork, and authorized playback. Made by kayefande-droid & co.
publish_to: none
version: 2.17.1+31
environment:
  sdk: ">=3.2.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.7
  video_player: ^2.9.1
  chewie: ^1.8.1
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.4
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.1
  firebase_analytics: ^11.3.3
  # Optional layers: compiled in but never started unless the flags in
  # lib/core/firebase_optional.dart are switched on.
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  workmanager: ^0.10.10
  flutter_local_notifications: 22.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
flutter:
  uses-material-design: true
  assets:
    - assets/brand/camanime-logo.png
