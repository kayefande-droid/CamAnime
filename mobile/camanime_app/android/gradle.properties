org.gradle.caching=false
org.gradle.parallel=true
# 4 GB: the Jetifier transform rewrites every dependency jar, including
# Flutter's ~150 MB engine jars, and OOMs ("Java heap space") at 2 GB.
org.gradle.jvmargs=-Xmx4096m
android.injected.buildCacheDir=../.gradle_local
# Every Android dependency in this app is AndroidX: the Flutter embedding,
# androidx.work (30-minute digest worker) and the whole Firebase BoM. Without
# this flag AGP refuses to resolve them and the tooling reports
# "Your app isn't using AndroidX".
android.useAndroidX=true
# Kept on so any transitive dependency still referencing com.android.support
# is rewritten to its AndroidX equivalent instead of failing the merge. If the
# dependency graph is ever audited clean it can be turned off to save build
# time (no first-party code here uses the old support libraries).
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
